<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">

  <title>城市散步工作坊</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header" id="top">
    <strong>城市散步工作坊</strong>
    <nav><a href="#intro">活動介紹</a><a href="#event">活動資訊</a><a href="#signup">立即報名</a></nav>
  </header>
  <main class="page">
    <!-- 活動主視覺：顯示散步行程名稱與簡介 -->
    <section class="hero" id="intro">
      <p class="eyebrow">TAIPEI WALKING TOUR</p>
      <h1>大稻埕午後散步</h1>
      <p>穿過老街與河岸，在三小時內認識城市的故事與生活風景。</p>
    </section>
    <section id="event" class="event-card with-badge">
      <span class="badge">剩 8 位</span>
      <h2>活動資訊</h2>
      <p>日期：2026 年 10 月 17 日</p>
      <p>時間：14:00–17:00</p>
      <p>集合：捷運北門站</p>
      <p class="description">路線包含北門、迪化街與河岸，沿途認識大稻埕的街區歷史與生活風景。</p>
    </section>
    <section class="signup" id="signup"><h2>準備好了嗎？</h2><button>我要報名</button></section>
  </main>
  <a class="back-top" href="#top" aria-label="回到頁首">↑</a>
