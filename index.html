<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>終極密碼</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js?v=2" defer></script>
</head>

<body class="game-page">

 <main class="app">
  <p class="eyebrow">猜數字遊戲</p>
  <h1>終極密碼</h1>
  <p>請猜出 1 到 100 之間的終極密碼。</p>

  <p id="range" class="range" aria-live="polite">1 ～ 100</p>

  <div class="field">
    <label for="guess">輸入你的猜測</label>
    <input id="guess" type="number" min="1" max="100" step="1" inputmode="numeric">
  </div>

  <div class="button-row">
    <button id="guess-button" type="button">猜！</button>
    <button id="reset-button" class="secondary" type="button">重新開始</button>
  </div>

  <p id="message" class="message" role="status" aria-live="polite">請輸入第一個數字</p>
  <p id="attempts" class="stats">已猜 0 次</p>
</main>

</body>
</html>
