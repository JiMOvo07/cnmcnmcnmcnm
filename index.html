<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JavaScript 練習</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>

<body class="calculator-page">

 <main class="app">
  <p class="eyebrow">任務 2</p>
  <h1>四則運算</h1>

  <div class="number-grid">
    <div class="field">
      <label for="number-a">數字 A</label>
      <input id="number-a" type="number" value="12">
    </div>
    <div class="field">
      <label for="number-b">數字 B</label>
      <input id="number-b" type="number" value="3">
    </div>
  </div>

  <div id="operator-buttons" class="button-row">
    <button data-op="add">加法</button>
    <button data-op="subtract">減法</button>
    <button data-op="multiply">乘法</button>
    <button data-op="divide">除法</button>
  </div>

  <p id="result" class="message">請選擇運算</p>
</main>

</body>
</html>
